<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Ticket Requests - Admin</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<div class="app-layout" id="app-layout">
  <div class="main-content">
    <div class="topbar">
      <button class="hamburger" id="hamburger">Menu</button>
      <div class="topbar-title">Ticket Requests</div>
      <div class="topbar-actions">
        <span style="background:rgba(255,152,0,0.15);color:#ff9800;padding:4px 12px;border-radius:999px;font-size:0.75rem;font-weight:700">ADMIN</span>
      </div>
    </div>
    <div class="page-body">

      <div class="stats-grid" id="ticket-stats" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">
        <div class="stat-card"><div class="loader"></div></div>
        <div class="stat-card"><div class="loader"></div></div>
        <div class="stat-card"><div class="loader"></div></div>
      </div>

      <div class="tabs" style="margin-top:24px">
        <button class="tab-btn active" onclick="switchTab('open')">Open</button>
        <button class="tab-btn" onclick="switchTab('progress')">In Progress</button>
        <button class="tab-btn" onclick="switchTab('resolved')">Resolved</button>
        <button class="tab-btn" onclick="switchTab('all')">All Tickets</button>
      </div>

      <div class="card">
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center">
          <select id="filter-ticket-emp" style="width:220px" onchange="loadTickets()"></select>
          <input type="text" id="search-ticket" placeholder="Search employee or issue..." style="width:220px" oninput="filterTickets()"/>
          <span id="ticket-count" style="font-size:0.82rem;color:var(--white-dim);margin-left:auto"></span>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Employee</th>
                <th>Issue Type</th>
                <th>Issue Date</th>
                <th>Description</th>
                <th>Status</th>
                <th>Raised On</th>
                <th>Admin Comment</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="tickets-tbody">
              <tr class="loading-row"><td colspan="8"><div class="loader"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<div id="ticket-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:999;align-items:center;justify-content:center;padding:20px">
  <div class="card" style="width:100%;max-width:640px">
    <div class="section-header">
      <div class="card-title" style="margin-bottom:0">Review Ticket</div>
      <button class="btn btn-secondary btn-sm" onclick="closeTicketModal()">Close</button>
    </div>

    <div id="ticket-modal-alert"></div>

    <div class="form-grid">
      <div class="form-group">
        <label>Employee</label>
        <input type="text" id="modal-employee" readonly/>
      </div>
      <div class="form-group">
        <label>Issue Type</label>
        <input type="text" id="modal-type" readonly/>
      </div>
      <div class="form-group">
        <label>Issue Date</label>
        <input type="text" id="modal-date" readonly/>
      </div>
      <div class="form-group">
        <label>Raised On</label>
        <input type="text" id="modal-created" readonly/>
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label>Description</label>
        <textarea id="modal-description" rows="4" readonly></textarea>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="modal-status">
          <option value="Open">Open</option>
          <option value="In Progress">In Progress</option>
          <option value="Resolved">Resolved</option>
        </select>
      </div>
      <div class="form-group">
        <label>Resolved On</label>
        <input type="text" id="modal-resolved" readonly/>
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label>Admin Comment</label>
        <textarea id="modal-comment" rows="4" placeholder="Add the action taken or the final resolution note..."></textarea>
      </div>
    </div>

    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-primary" id="save-ticket-btn" onclick="saveTicketUpdate()">Save Update</button>
      <button class="btn btn-secondary" onclick="closeTicketModal()">Cancel</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="../js/api.js"></script>
<script src="../js/admin-sidebar.js"></script>
<script>
let currentStatus = 'Open';
let allTickets = [];
let selectedTicket = null;

document.addEventListener('DOMContentLoaded', async () => {
  const user = requireAdmin();
  if (!user) return;

  await populateEmployeeDropdown('filter-ticket-emp', true);
  loadTicketStats();
  loadTickets();
});

function switchTab(tab) {
  const statusMap = {
    open: 'Open',
    progress: 'In Progress',
    resolved: 'Resolved',
    all: '',
  };

  currentStatus = statusMap[tab];
  document.querySelectorAll('.tab-btn').forEach((btn, index) => {
    btn.classList.toggle('active', ['open', 'progress', 'resolved', 'all'][index] === tab);
  });
  loadTickets();
}

async function loadTicketStats() {
  try {
    const [openRes, progressRes, resolvedRes] = await Promise.all([
      api.get('/tickets?status=Open'),
      api.get('/tickets?status=In%20Progress'),
      api.get('/tickets?status=Resolved'),
    ]);

    const openTickets = openRes.data || openRes;
    const progressTickets = progressRes.data || progressRes;
    const resolvedTickets = resolvedRes.data || resolvedRes;

    document.getElementById('ticket-stats').innerHTML = `
      <div class="stat-card amber"><div class="stat-label">Open Tickets</div><div class="stat-value text-amber">${openTickets.length}</div><div class="stat-sub">Waiting for review</div></div>
      <div class="stat-card"><div class="stat-label">In Progress</div><div class="stat-value text-cyan">${progressTickets.length}</div><div class="stat-sub">Being handled</div></div>
      <div class="stat-card green"><div class="stat-label">Resolved</div><div class="stat-value text-green">${resolvedTickets.length}</div><div class="stat-sub">Closed successfully</div></div>`;
  } catch (err) {
    document.getElementById('ticket-stats').innerHTML = `<div class="alert alert-error" style="grid-column:1/-1">Warning: ${err.message}</div>`;
  }
}

async function loadTickets() {
  const tbody = document.getElementById('tickets-tbody');
  const employeeId = document.getElementById('filter-ticket-emp').value;
  const params = [];

  if (currentStatus) params.push(`status=${encodeURIComponent(currentStatus)}`);
  if (employeeId) params.push(`employee_id=${encodeURIComponent(employeeId)}`);

  tbody.innerHTML = '<tr class="loading-row"><td colspan="8"><div class="loader"></div></td></tr>';

  try {
    const res = await api.get('/tickets' + (params.length ? '?' + params.join('&') : ''));
    allTickets = res.data || res;
    renderTickets(allTickets);
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="8"><div class="alert alert-error">Warning: ${err.message}</div></td></tr>`;
  }
}

function filterTickets() {
  const query = document.getElementById('search-ticket').value.trim().toLowerCase();
  if (!query) {
    renderTickets(allTickets);
    return;
  }

  const filtered = allTickets.filter((ticket) => {
    const haystack = [
      ticket.employeeName,
      ticket.type,
      ticket.description,
      ticket.adminComment,
      ticket.status,
    ].join(' ').toLowerCase();
    return haystack.includes(query);
  });

  renderTickets(filtered);
}

function renderTickets(tickets) {
  const tbody = document.getElementById('tickets-tbody');
  document.getElementById('ticket-count').textContent = `${tickets.length} ticket(s)`;

  if (!tickets.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--white-dim)">No tickets found</td></tr>';
    return;
  }

  tbody.innerHTML = tickets.map((ticket) => {
    const safeEmployee = escapeHtml(ticket.employeeName);
    const safeType = escapeHtml(ticket.type);
    const safeDescription = escapeHtml(ticket.description);
    const safeComment = escapeHtml(ticket.adminComment || '—');

    return `<tr>
      <td><strong>${safeEmployee}</strong></td>
      <td><span class="badge badge-pending">${safeType}</span></td>
      <td>${fmtDate(ticket.date)}</td>
      <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${safeDescription}">${safeDescription}</td>
      <td>${statusBadge(ticket.status)}</td>
      <td>${fmtDateTime(ticket.createdAt)}</td>
      <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${safeComment}">${safeComment}</td>
      <td><button class="btn btn-primary btn-sm" onclick="openTicketModal('${ticket._id}')">Review</button></td>
    </tr>`;
  }).join('');
}

async function openTicketModal(ticketId) {
  selectedTicket = allTickets.find((ticket) => ticket._id === ticketId) || null;

  if (!selectedTicket) {
    try {
      selectedTicket = await api.get(`/tickets/${ticketId}`);
    } catch (err) {
      showToast(err.message, 'error');
      return;
    }
  }

  document.getElementById('modal-employee').value = selectedTicket.employeeName || '';
  document.getElementById('modal-type').value = selectedTicket.type || '';
  document.getElementById('modal-date').value = fmtDate(selectedTicket.date);
  document.getElementById('modal-created').value = fmtDateTime(selectedTicket.createdAt);
  document.getElementById('modal-description').value = selectedTicket.description || '';
  document.getElementById('modal-status').value = selectedTicket.status || 'Open';
  document.getElementById('modal-resolved').value = fmtDateTime(selectedTicket.resolvedAt);
  document.getElementById('modal-comment').value = selectedTicket.adminComment || '';
  document.getElementById('ticket-modal-alert').innerHTML = '';
  document.getElementById('ticket-modal').style.display = 'flex';
}

function closeTicketModal() {
  document.getElementById('ticket-modal').style.display = 'none';
  document.getElementById('ticket-modal-alert').innerHTML = '';
  selectedTicket = null;
}

async function saveTicketUpdate() {
  if (!selectedTicket) return;

  const status = document.getElementById('modal-status').value;
  const adminComment = document.getElementById('modal-comment').value.trim();
  const alertBox = document.getElementById('ticket-modal-alert');
  const saveBtn = document.getElementById('save-ticket-btn');

  saveBtn.disabled = true;
  alertBox.innerHTML = '';

  try {
    const res = await api.patch(`/tickets/${selectedTicket._id}`, { status, adminComment });
    showToast(res.message || 'Ticket updated successfully', 'success');
    closeTicketModal();
    await Promise.all([loadTickets(), loadTicketStats()]);
  } catch (err) {
    alertBox.innerHTML = `<div class="alert alert-error">Warning: ${err.message}</div>`;
  } finally {
    saveBtn.disabled = false;
  }
}
</script>
</body>
</html>
